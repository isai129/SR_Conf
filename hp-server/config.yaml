# ==========================================================
# Mihomo (Clash Meta) TProxy 原生部署配置 · hp-server (Fedora 43)
# 部署方式：/usr/local/sbin/mihomo -d /etc/mihomo，由 mihomo-ctl 脚本管理
#   (策略路由 + nftables 透明代理，不占用 TUN)
# 网络环境：Tailscale 网内 (100.64.0.0/10, *.ts.net) + 家庭 LAN 192.168.10.0/24
# ==========================================================
# 注意：
#   1. 本文件是脱敏模板 —— 机场订阅链接与 external-controller 密钥已清空，
#      请手动补录（切勿把真实链接/密钥提交到公开仓库）
#   2. 若本机 MagicDNS 失效（resolv.conf 无法被 Tailscale 修改），
#      依赖下方 nameserver-policy "+.ts.net" -> 100.100.100.100 保持 tailnet 域名可解析
#   3. 外部控制端口用 19090 避开 Cockpit 的 9090
# ==========================================================

# --- 1. 基础连接配置 ---
port: 7890
socks-port: 7891
mixed-port: 7892
tproxy-port: 7893 # TProxy 流量入口（配合 nftables 转发）
allow-lan: true
mode: Rule
routing-mark: 1024
log-level: warning
ipv6: false # 配合内核禁用 IPv6，防止侧漏
unified-delay: true
experimental:
  ignore-resolve-fail: true

# --- 2. 外部控制 ---
# 面板连接地址：http://宿主IP:19090 （zashboard / metacubexd 均可）
external-controller: 0.0.0.0:19090
secret: "" # <--- 手动补录控制密钥（Zashboard 首次连接需输入）

# --- 3. 核心控制与嗅探 ---
sniffer:
  enable: true
  sniff:
    TLS: { ports: [443, 8443] }
    HTTP: { ports: [80, 8080-8888], override-destination: true }
    QUIC: { ports: [443] }
  skip-certs: true

# --- 4. DNS 配置 (Fake-IP 模式，0.0.0.0:53 配合 nftables 转发) ---
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  listen: 0.0.0.0:53 # nftables 把 UDP 53 转发到这里
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.tailscale.net" # 排除 Tailscale 域名
    - "+.ts.net"        # MagicDNS 走真实解析
    - "msftconnecttest.com"
    - "msftncsi.com"
  nameserver-policy:
    "+.ts.net": 100.100.100.100
    "+.tailscale.net": 100.100.100.100
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# --- 5. 代理组配置（机场链接保持隐藏，手动补录） ---
proxy-providers:
  # 【静态源】本地备份节点（文件不在仓库内，自行创建 ./local/backup.yaml）
  local_backup:
    type: file
    path: ./local/backup.yaml
    health-check:
      enable: true
      interval: 7200 # 2小时后台静默检查
      url: https://www.gstatic.com/generate_204
  # 【动态源】机场订阅 —— url 留空待补录
  remote_sub:
    type: http
    url: "" # <--- 手动填入机场订阅链接（勿提交到公开仓库）
    interval: 86400
    path: ./sub/airport.yaml
    health-check:
      enable: true
      interval: 7200
      url: https://www.gstatic.com/generate_204

# --- 6. Proxy Groups ---
proxy-groups:
  # 【服务总控 - 默认 Auto（跨地区全局自动测速），免手动改节点】
  - name: Proxy
    type: select
    use: [remote_sub]
    proxies: [Auto, Fallback, HK, TW, JP, US, SG, DIRECT]

  # 故障转移组（本地备份节点，过滤维护/公益/坏节点）
  - name: Fallback
    type: fallback
    use: [local_backup]
    filter: "(?i)HK|TW|JP|US|SG|港|台|日|美|新"
    exclude-filter: "(?i)维护|維修|被墙|牆|公益|备用|備用|x0[.]8|x5|流量|過期|过期|买游戏|盛宴|注册Netflix"
    url: https://www.gstatic.com/generate_204
    interval: 600 # 10分钟检查一次

  - name: AI
    type: select
    proxies: [Auto, TW, US, JP, SG, HK, Proxy]

  - name: GitHub
    type: select
    proxies: [Auto, US, SG, HK, Proxy]

  # 国内直连优先，Auto 兜底
  - name: Steam
    type: select
    proxies: [DIRECT, Auto, HK, TW, US, Proxy]

  - name: Microsoft
    type: select
    proxies: [DIRECT, Auto, TW, US, Proxy]

  - name: Apple
    type: select
    proxies: [DIRECT, Auto, TW, HK, Proxy]

  - name: Google
    type: select
    proxies: [Auto, TW, SG, JP, HK, Proxy]

  - name: Telegram
    type: select
    proxies: [Auto, SG, HK, Proxy]

  - name: Unlock # 国内视频解锁（针对贝塔、盛宴节点）
    type: select
    use: [remote_sub]
    filter: "(?i)CN|中国|貝塔|贝塔|盛宴"
    proxies:
      - DIRECT

  # 【自动优选 - 唯一持续测速的组】
  - name: Auto
    type: url-test
    use: [remote_sub]
    filter: "(?i)HK|TW|JP|US|SG|港|台|日|美|新"
    exclude-filter: "(?i)维护|維修|被墙|牆|公益|备用|備用|x0[.]8|x5|流量|過期|过期|买游戏|盛宴|注册Netflix"
    interval: 1800 # 0.5小时测速一次
    tolerance: 50
    lazy: false # 仅此组持续测速；区域池保持 lazy:true
    timeout: 2000
    max-failed-times: 2
    expected-statuses: [204, 302]
    url: https://www.gstatic.com/generate_204

  # 【地区池 - 懒加载】
  - name: HK
    type: url-test
    use: [remote_sub]
    filter: "(?i)HK|香港|九龙|九龍|波澜|波瀾|嘉禾|安魂|铠甲|鎧甲|契约|契約|奇点|奇點|判官|灵魂"
    interval: 3600
    lazy: true

  - name: TW
    type: url-test
    use: [remote_sub]
    filter: "(?i)TW|台湾|台灣|台北|彰化|宝岛|寶島|动画疯|動畫瘋"
    interval: 3600
    tolerance: 50
    lazy: true

  - name: JP
    type: url-test
    use: [remote_sub]
    filter: "(?i)JP|日本|東京|大和|柯南|星移"
    interval: 3600
    tolerance: 50
    lazy: true

  - name: US
    type: url-test
    use: [remote_sub]
    filter: "(?i)US|美国|美國|加州|川谱|川譜|神像|胜地|勝地|空灵"
    interval: 3600
    lazy: true

  - name: SG
    type: url-test
    use: [remote_sub]
    filter: "(?i)SG|新加坡|星岛|星島|烈焰"
    interval: 3600
    lazy: true

  - name: Final
    type: select
    proxies: [Proxy, DIRECT]

# --- 7. Rule Providers ---
rule-providers:
