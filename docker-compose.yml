services:
  mihomo:
    container_name: mihomo
    image: metacubex/mihomo:latest
    restart: unless-stopped
    init: true # 容器内收殓僵尸进程，避免 mihomo 子进程残留
    # host 模式：容器直接使用宿主机网络栈，TUN 路由与 LAN 访问都走宿主网络
    network_mode: host
    # TUN 网卡与流量管理所需权限
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - label:disable # 解除 SELinux 对容器网卡的限制（Fedora 必需）
    environment:
      - TZ=Asia/Shanghai
    volumes:
      # 配置文件目录：放入 config.yaml + rules/ + sub/ + local/（见仓库模板）
      - ./config:/root/.config/mihomo
      - /dev/net/tun:/dev/net/tun
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # 存活检查：secret 留空时可正常返回 200；
    # 若在 config.yaml 里设置了 secret，请同步改为
    # curl -fsS -o /dev/null -H "Authorization: Bearer <你的secret>" http://127.0.0.1:9090/version
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9090/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  zashboard:
    container_name: zashboard
    image: ghcr.io/zephyruso/zashboard:latest
    restart: unless-stopped
    ports:
      - "9097:80"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      mihomo:
        condition: service_healthy
